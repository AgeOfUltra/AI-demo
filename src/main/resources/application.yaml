spring:
  application:
    name: AI-demo
  config:
    import:
      - optional:file:.env[.properties]
  ai:
    google:
      genai:
        api-key: ${GOOGLEAI_API_KEY}
        chat:
          model: gemini-3.5-flash-lite
        embedding:
          api-key: ${GOOGLEAI_API_KEY}
          text:
            model: gemini-embedding-2im
    vectorstore:
      pinecone:
        api-key: ${PINE_CONE_API_KEY}
        index-name: springaidemo-01
    model:
      audio:
        transcription: gemini-3.5-transcribe
  servlet:
    multipart:
      max-file-size: 10MB
#          max-output-tokens: 20
#          temperature: 0.7

custome:
  api-key: ${OWN_IMAGE_GENERATE_API_KEY}
  base-url: https://free-image-generation-api.marveltony007.workers.dev
  method: POST

server:
  port: 8081

