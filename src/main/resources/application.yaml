spring:
  application:
    name: AI-demo
  config:
    import:
      - optional:file:.env[.properties]
  ai:
    google:
      genai:
        api-key: ${GOOGLEAI_API_KEY}
        chat:
          model: gemini-3.5-flash-lite
        embedding:
          api-key: ${GOOGLEAI_API_KEY}
          text:
            model: gemini-embedding-2im
        image:
          model: gemini-3.1-flash-image
    vectorstore:
      pinecone:
        api-key: ${PINE_CONE_API_KEY}
        index-name: springaidemo-01
  servlet:
    multipart:
      max-file-size: 10MB
#          max-output-tokens: 20
#          temperature: 0.7

server:
  port: 8081

